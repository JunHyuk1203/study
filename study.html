<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>학습 — study</title><link rel="stylesheet" href="styles.css?v=20261021-12"><script src="navigation.js?v=20261021-12"></script><script type="module" src="app.js?v=20261021-12"></script></head><body><div class="app">
<header class="header"><a class="brand" href="index.html">STUDY.</a><a class="profile-dot" href="account.html" aria-label="내 계정">J</a></header>
<main><div class="page-heading"><h1>학습</h1></div>
<section class="study-cam" data-camera data-state="off" aria-label="스터디캠">
<label class="subject-picker">학습 과목<select data-study-subject><option value="math">수학</option><option value="korean">국어</option><option value="english">영어</option><option value="science">과학</option><option value="social">사회</option><option value="other">기타</option></select></label>
<div class="cam-viewport"><div class="cam-video-mount" data-camera-video></div><button class="cam-toggle" data-camera-toggle data-study-action="start" aria-label="얼굴 인식으로 학습 시작"><svg class="cam-face" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 18v5m16-5v5M25 18v10h-4m-5 5c4 4 12 4 16 0"/></svg><i class="cam-corner tl"></i><i class="cam-corner tr"></i><i class="cam-corner bl"></i><i class="cam-corner br"></i><span class="cam-scan"></span></button><span class="cam-live" data-camera-resolution></span></div>
<p class="cam-status" data-camera-status role="status" aria-live="polite">얼굴 인식으로 학습 시작</p>
<button class="cam-existing" data-existing-session data-study-action="stop" hidden>진행 중인 학습 종료 및 저장</button>
<p class="auth-status" data-sync-status role="status" aria-live="polite" hidden></p>
<p class="cam-caption">영상은 기기에서만 처리됩니다.</p>
</section>
<template id="camera-focus-template"><section class="camera-focus" role="dialog" aria-modal="true" aria-label="스터디캠 학습창"><div class="focus-header"><strong>STUDY.</strong><span data-focus-subject></span></div><section class="study-cam focus-content" data-camera data-state="opening"><div class="cam-viewport"><div class="cam-video-mount" data-camera-video></div><div class="cam-toggle" aria-hidden="true"><i class="cam-corner tl"></i><i class="cam-corner tr"></i><i class="cam-corner bl"></i><i class="cam-corner br"></i><span class="cam-scan"></span></div><span class="cam-live" data-camera-resolution></span></div><p class="cam-status" data-camera-status role="status" aria-live="polite">카메라 연결 중…</p><div class="timer-panel cam-timer"><div><span class="tiny green" data-timer-state>얼굴 인식 준비 중</span><p class="timer" data-active-timer>00:00:00</p></div><button class="cam-end" data-study-action="stop">종료</button></div><p class="auth-status" data-sync-status role="status" hidden></p><p class="cam-caption">영상은 기기에서만 처리됩니다.</p></section></section></template>
<div class="two-columns"><section class="card study-stat"><p class="tiny muted">오늘의 학습 시간</p><p class="metric" data-time="today">0시간 00분</p></section><section class="card study-stat"><p class="tiny muted">이번 주 학습 시간</p><p class="metric" data-time="week">0시간 00분</p></section></div>
<div class="two-columns"><section class="card study-stat"><p class="tiny muted">이번 달 학습 시간</p><p class="metric" data-time="month">0시간 00분</p></section><section class="card study-stat"><p class="tiny muted">연속 학습</p><p class="metric"><span data-streak>0</span><span>일</span></p></section></div>
<section class="card"><div class="section-title"><h2>과목별 학습</h2><span class="tiny muted">이번 주</span></div><div class="week-chart chart-large" data-chart="subjects" aria-label="이번 주 과목별 학습 시간"></div></section>
</main>
<nav class="bottom-nav" aria-label="주 메뉴"><a href="index.html"><span>⌂</span>홈</a><a href="study.html" aria-current="page"><span>◷</span>학습</a><a href="school.html"><span>▦</span>학교</a><a href="play.html"><span>♧</span>플레이</a><a href="account.html"><span>♙</span>계정</a></nav></div><script src="header.js?v=20261021-12" defer></script></body></html>
