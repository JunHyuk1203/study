<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 — STUDY.</title><link rel="stylesheet" href="styles.css?v=20261021-23"><script type="module" src="app.js?v=20261021-23"></script></head><body><div class="app">
<header class="header"><a class="brand" href="index.html">STUDY.</a><a href="account.html" class="auth-back">닫기</a></header>
<main class="auth-main"><div class="page-heading"><h1>로그인</h1></div><section class="card auth-card"><button class="google-button" data-auth-action="google" type="button" disabled><span class="google-letter" aria-hidden="true">G</span>Google로 계속하기</button><div class="auth-divider"><span>또는 이메일로 로그인</span></div><form data-auth-form="login"><label class="form-field">이메일<input name="email" type="email" autocomplete="email" maxlength="254" required placeholder="name@example.com"></label><label class="form-field">비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="비밀번호 입력"></label><div class="auth-option-row"><a href="reset-password.html">비밀번호 찾기</a></div><button type="submit" class="primary-button" disabled>로그인</button></form><p data-auth-status class="auth-status" role="status" aria-live="polite" hidden></p></section><p class="auth-switch">계정이 없으신가요? <a href="signup.html">회원가입</a></p></main></div></body></html>
