<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>학교 스터디룸 — study</title><link rel="stylesheet" href="styles.css?v=20261023-15"><script type="module" src="app.js?v=20261023-15"></script></head>
<body><div class="app">
<header class="header"><a class="brand" href="index.html">STUDY.</a><a class="profile-dot" href="account.html" aria-label="내 계정">·</a></header>
<main aria-label="스터디룸">
<p><a class="tiny muted" href="study.html">← 학습으로 돌아가기</a></p>
<section id="study-room" class="social-space study-room-launch" data-social aria-label="스터디룸">
<p class="auth-status" data-social-login>스터디룸을 불러오는 중…</p><p class="auth-status is-error" data-social-error role="status" hidden></p>
<div data-social-content hidden><button type="button" class="social-launcher" data-social-open="rooms" aria-haspopup="dialog" aria-controls="rooms-panel"><span class="social-launcher-icon" aria-hidden="true">◷</span><span><strong>스터디룸</strong><span class="tiny muted" data-school-room-label>계정 정보를 불러오는 중…</span></span><span class="social-launcher-arrow" aria-hidden="true">↗</span><span class="social-launcher-badge" data-room-invite-count hidden></span></button>
<dialog id="rooms-panel" class="social-dialog room-browser-dialog" data-social-panel="rooms" aria-labelledby="rooms-panel-title">
<div class="social-dialog-heading"><div><p class="tiny muted">지금, 함께 공부해요</p><h2 id="rooms-panel-title">스터디룸</h2></div><button type="button" class="social-dialog-close" data-social-close aria-label="스터디룸 팝업 닫기">×</button></div>
<div class="social-dialog-body"><p class="auth-status is-error" data-social-error role="status" hidden></p>
<section class="card" data-room-current hidden><h2>현재 방</h2><div data-room-panel></div>
<form data-room-settings data-social-form="updateRoom" hidden><h3>방 설정</h3><label class="form-field">방 이름<input name="title" maxlength="40" required></label><label class="form-field">공개 여부<select name="visibility"><option value="private">비공개 · 친구 초대 또는 방 코드</option><option value="public">공개 · 같은 학교에 표시</option></select></label><label class="room-grade-option"><input type="checkbox" name="allowOtherGrades"> 공개방에서 같은 학교의 다른 학년도 보기·입장 허용</label><button type="submit" class="secondary-button">설정 저장</button></form>
<div class="room-code-tools" data-room-code-tools hidden><p class="room-code-value" data-room-code></p><button type="button" class="social-button" data-social-action="roomCode">방 코드 생성·재발급</button></div>
</section>
<section class="card room-join-card" data-room-browse><h2>방 참여</h2><div class="room-directory-group"><div class="section-title"><h3>방 목록</h3><button type="button" class="social-button" data-social-action="refreshSchoolRooms">새로고침</button></div><p class="tiny muted">내 학년 기본방 · 참여 가능한 공개방 · 초대받은 비공개방</p><div data-room-directory aria-live="polite"></div></div><div class="room-join-code"><h3>참여 코드 입력</h3><p class="tiny muted">비공개 방은 학교·학년과 관계없이 참여할 수 있어요.</p><form class="social-inline-form" data-social-form="previewCode"><label class="form-field">방 코드<input name="code" minlength="6" maxlength="16" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="6자리 코드 (예: K7M2PX)"></label><button type="submit" class="secondary-button">입장 전 확인</button></form><div data-room-code-preview aria-live="polite"></div></div></section>
<section class="card" data-room-browse><form data-social-form="createRoom"><h2>방 만들기</h2><label class="form-field">방 이름<input name="title" maxlength="40" required placeholder="예: 오늘 같이 공부해요"></label><label class="form-field">공개 여부<select name="visibility"><option value="private">비공개 · 친구 초대 또는 방 코드</option><option value="public">공개 · 같은 학교에 표시</option></select></label><label class="room-grade-option"><input type="checkbox" name="allowOtherGrades"> 공개방에서 같은 학교의 다른 학년도 보기·입장 허용</label><button type="submit" class="primary-button">만들고 입장하기</button></form><p class="tiny muted">모두 나가면 즉시 삭제됩니다. 참여자 모두 서비스에 3시간 이상 접속하지 않아도 방·초대·코드가 자동 삭제됩니다. 학교·학년 기본방은 유지됩니다.</p></section>
</div></dialog></div>
<dialog class="goal-dialog" data-social-confirm aria-labelledby="room-confirm-title"><h2 id="room-confirm-title">방을 삭제할까요?</h2><p class="report-note" data-confirm-text></p><div class="social-actions"><button type="button" class="social-button" data-social-action="dismiss">취소</button><button type="button" class="social-button social-danger" data-social-action="confirm" data-confirm-action>확인</button></div></dialog>
</section>
</main>
<nav class="bottom-nav" aria-label="주 메뉴"><a href="index.html"><span>⌂</span>홈</a><a href="study.html" aria-current="page"><span>◷</span>학습</a><a class="nav-ai" href="ai.html"><span>✧</span>AI 질문하기</a><a href="school.html"><span>⌂</span>학교</a><a href="play.html"><span>♧</span>플레이</a></nav>
</div><script src="header.js?v=20261022-1" defer></script></body></html>
