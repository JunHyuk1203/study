<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회원가입 — STUDY.</title><link rel="stylesheet" href="styles.css?v=20261021-16"><script type="module" src="app.js?v=20261021-16"></script></head><body><div class="app">
<header class="header"><a class="brand" href="index.html">STUDY.</a><a href="login.html" class="auth-back">로그인</a></header>
<main class="auth-main"><div class="page-heading"><h1>회원가입</h1></div><section class="card auth-card"><button class="google-button" data-auth-action="google" type="button" disabled><span class="google-letter" aria-hidden="true">G</span>Google로 계속하기</button><div class="auth-divider"><span>또는 이메일로 가입</span></div><form data-auth-form="signup"><label class="form-field">닉네임<input name="displayName" autocomplete="nickname" minlength="2" maxlength="20" required placeholder="2~20자"></label><label class="form-field">이메일<input name="email" type="email" autocomplete="email" maxlength="254" required placeholder="name@example.com"></label><label class="form-field">비밀번호<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required placeholder="12자 이상"></label><label class="form-field">비밀번호 확인<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required placeholder="비밀번호 다시 입력"></label><button type="submit" class="primary-button" disabled>회원가입</button></form><p data-auth-status class="auth-status" role="status" aria-live="polite" hidden></p><a class="primary-button" data-auth-success href="account.html" hidden>계정으로 이동</a></section><p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p></main></div></body></html>
